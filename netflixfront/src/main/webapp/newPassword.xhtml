<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" 
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:p="http://primefaces.org/ui">


<h:head>
	<script src="script.js"></script>
	<link
		href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
		rel="stylesheet"
		integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
		crossorigin="anonymous"></link>
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
		crossorigin="anonymous"></script>
	<link rel="stylesheet" href="style.css"></link>
	<link rel="stylesheet"
		href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
	<script src="https://kit.fontawesome.com/e5507d7bda.js" />

	<link rel="icon" type="image/png" href="netflix_logo_icon_170919.ico" />
	<title>Netflix</title>
</h:head>
<h:body>


	<img class="logo animate__animated animate__bounceInLeft"
		src="netflix.png" />



	<div id="formLogin" class="animate__animated animate__bounceInLeft">
		<div class="card">
			<h:form id="formIn">
				<center>
					<h2 class="titulo">Nueva Contraseña</h2>
				</center>
				<h:messages globalOnly="false" showSummary="false" showDetail="true"
					styleClass="alert alert-danger" />

				<div class="field" style="margin-bottom: 20px;">
					<span class="ui-float-label"> <p:password id="contrasena"
							value="#{UserBean.password}" required="true" style="width: 100%;"
							validatorMessage="La contraseña debe tener al menos 6 caracteres, incluir un número y un símbolo especial.">
							<f:validateLength minimum="6" maximum="20" />
							<f:validateRegex
								pattern="^(?=.*[0-9])(?=.*[!@#$%^&amp;*])[A-Za-z0-9!@#$%^&amp;*]{6,}$" />
						</p:password> <p:outputLabel for="contrasena" value="Contraseña:" />
					</span>
				</div>

				<div class="field" style="margin-bottom: 20px;">
					<span class="ui-float-label"> <p:password
							id="contrasenaVerificar" value="#{UserBean.passwordCheck}"
							required="true" style="width: 100%;" /> <p:outputLabel for="contrasenaVerificar"
							value="Verificar Contraseña:" />
					</span>
				</div>
				<div class="container text-center">
					<div class="row align-items-start">
						<p:commandButton action="#{UserBean.cambiarContrasegna}"
							value="Cambiar Contraseña" styleClass="custom-button"
							update="@form" />
					</div>
				</div>
			</h:form>
		</div>
	</div>

</h:body>
</html>
