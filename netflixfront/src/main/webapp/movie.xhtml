<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" 
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:p="http://primefaces.org/ui">

<h:head>
	<script src="script.js"></script>
	<link
		href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
		rel="stylesheet"
		integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
		crossorigin="anonymous" />
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
		crossorigin="anonymous"></script>
	<link rel="stylesheet" href="menuStyle.css" />
	<link rel="stylesheet"
		href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
	<script src="https://kit.fontawesome.com/e5507d7bda.js"></script>
	<link rel="icon" type="image/png" href="netflix_logo_icon_170919.ico" />
	<title>Netiflix</title>
</h:head>

<h:body>
	<header>
	<div class="logo">
		<h:outputLink value="menu.xhtml?faces-redirect=true">
			<h:graphicImage
				styleClass="net animate__animated animate__bounceInLeft"
				value="netflix.png" />
		</h:outputLink>
	</div>
	<div class="search-box">
		<h:form id="searchForm">
			<p:messages id="messages" showDetail="true" showSummary="true"
				closable="true" />

			<div class="search-container">
				<p:inputText id="buscar" styleClass="search-input"
					value="#{MovieBean.buscar}" placeholder="Buscar..." />
				<p:commandButton value="Buscar" styleClass="search-button"
					action="#{MovieBean.search}" id="searchButton" update="messages"
					ajax="true" />
			</div>
		</h:form>

	</div>

	<nav>
	<div class="container-fluid">
		<div class="dropdown">
			<button class="btn btn-outline-light dropdown-toggle" type="button"
				id="menuOpciones" data-bs-toggle="dropdown" aria-expanded="false">
				<i class="fa-solid fa-user"></i> Mi Cuenta
			</button>
			<ul class="dropdown-menu dropdown-menu-end"
				aria-labelledby="menuOpciones">
				<li><h:form>
						<p:commandLink styleClass="dropdown-item"
							action="menu.xhtml?faces-redirect=true" ajax="false"
							immediate="true">
							<i class="fa-solid fa-film"></i> Peliculas
                            </p:commandLink>
					</h:form></li>
				<li><h:form>
						<p:commandLink styleClass="dropdown-item"
							action="menu.xhtml?faces-redirect=true" ajax="false"
							immediate="true">
							<i class="fa-solid fa-download"></i> Inicios de sesión
                            </p:commandLink>
					</h:form></li>
				<li><h:form>
						<p:commandLink styleClass="dropdown-item"
							action="resetPassword.xhtml?faces-redirect=true" ajax="false"
							immediate="true">
							<i class="fa-solid fa-key"></i> Cambiar Contraseña
                            </p:commandLink>
					</h:form></li>
				<li><h:form>
						<p:commandLink styleClass="dropdown-item text-danger"
							action="index.xhtml?faces-redirect=true" ajax="false"
							immediate="true">
							<i class="fa-solid fa-right-from-bracket"></i> Cerrar Sesión
                            </p:commandLink>
					</h:form></li>
			</ul>
		</div>
	</div>
	</nav> </header>
	<h:form>
		<h2>#{peliculaT.nombre}</h2>
		<div></div>
		<iframe width="100%" height="700" src="#{MovieBean.url}"
			title="YouTube video player" frameborder="0"
			allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
			referrerpolicy="strict-origin-when-cross-origin"
			allowfullscreen="true"></iframe>

	</h:form>
	<footer>
	<p>© 2023 MiNetflix. Todos los derechos reservados.</p>

	</footer>

	<label for="theme" class="theme"> <span
		class="theme__toggle-wrap"> <input id="theme"
			class="theme__toggle" type="checkbox" role="switch" name="theme"
			value="dark" /> <span class="theme__fill"></span> <span
			class="theme__icon"> <span class="theme__icon-part"></span> <span
				class="theme__icon-part"></span> <span class="theme__icon-part"></span>
				<span class="theme__icon-part"></span> <span
				class="theme__icon-part"></span> <span class="theme__icon-part"></span>
				<span class="theme__icon-part"></span> <span
				class="theme__icon-part"></span> <span class="theme__icon-part"></span>
		</span>
	</span>
	</label>
</h:body>
</html>
